name: CI - Build & Test

# Code push বা PR করলে automatically run হবে
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Code Quality Check
  lint:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint
        continue-on-error: true

  # Job 2: Build Test
  build:
    name: 🏗️ Build Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Next.js App
        run: npm run build
        env:
          # Build করার জন্য dummy values (real secrets লাগবে না)
          MONGODB_URI: mongodb://localhost:27017/test
          NEXTAUTH_SECRET: test-secret-for-build
          NEXTAUTH_URL: https://example.com

      - name: ✅ Success
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Build successful!"
          echo "✅ Lint check passed!"
          echo "✅ Ready for deployment!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
