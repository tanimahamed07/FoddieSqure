name: Deploy to Docker Hub

# যখন main branch এ code push করবেন তখন automatically run হবে
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Code download করুন
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Docker Hub এ login করুন
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Docker image build এবং push করুন
      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/foodiesquare:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/foodiesquare:latest

      # Step 4: Success message
      - name: Done
        run: echo "✅ Successfully deployed to Docker Hub!"
